rest:
  listenAddr: ":8001"
  pg:
    connString: "host=db-postgresql port=5432 user=pigo password=pigopw dbname=main sslmode=disable" # container
    # connString: "host=localhost port=5432 user=pigo password=pigopw dbname=main sslmode=prefer"    # local
  oidc:
    issuer: https://YOUR.LAN.IP.ADDR:5556/iam
    skipTLSVerify: true                             # for testing only
    clientID: public-webui
    clientSecret: any
    roleClaimKey: .policy.pgrole
  basicAuth: {}
  anonRole: anon
  basePath: /api
